name: tag-release

# Tags every release on main: v<version in plugin.json>, created once if missing.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create the tag if it does not exist
        run: |
          v="v$(node -p "require('./plugins/starterkit/.claude-plugin/plugin.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" > /dev/null; then
            echo "$v already exists"
            exit 0
          fi
          git tag "$v" "$GITHUB_SHA"
          git push origin "$v"
          echo "created $v"
